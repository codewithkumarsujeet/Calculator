<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Step-by-Step Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <h1>Calculator</h1>
    
    <input type="text" id="firstNumber" placeholder="Enter operation" />
    
    <div class="buttons">
      <div class="btn-key">7</div>
      <div class="btn-key">8</div>
      <div class="btn-key">9</div>
      <div class="btn-key">+</div>
      <div class="btn-key">4</div>
      <div class="btn-key">5</div>
      <div class="btn-key">6</div>
      <div class="btn-key">-</div>
      <div class="btn-key">1</div>
      <div class="btn-key">2</div>
      <div class="btn-key">0</div>
      <div class="btn-key">*</div>
      <div class="btn-key double-zero">00</div>
      <div class="btn-key">.</div>
      <div class="btn-key">/</div>
      <div class="btn-key AC">AC</div>
      <div class="btn-key x">x</div>
      <div class="btn-key result">=</div>
    </div>

  </div>

  <script src="index.js"></script>
</body>
</html>
